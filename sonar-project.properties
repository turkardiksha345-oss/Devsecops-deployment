# SonarCloud / SonarQube Project Configuration
sonar.projectKey=turkardiksha345-oss_Devsecops-deployment
sonar.organization=turkardiksha345-oss
sonar.projectName=Devsecops-deployment
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=app
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Inclusions and Exclusions
sonar.inclusions=app/**,tests/**
sonar.exclusions=**/tests/**,**/htmlcov/**,**/reports/**,**/security-reports/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.pyc

# Quality Gate enforcement configuration
sonar.qualitygate.wait=true
