name: Reusable Docker Image Build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker repository / image name"
        required: false
        default: ""
        type: string
      push:
        description: "Whether to push image to container registry"
        required: false
        default: false
        type: boolean
      registry:
        description: "Container registry host"
        required: false
        default: "ghcr.io"
        type: string
    secrets:
      registry-token:
        description: "Authentication token for container registry"
        required: false
    outputs:
      image-tag:
        description: "Git SHA based image tag"
        value: ${{ jobs.image-build.outputs.image_tag }}
      image-uri:
        description: "Full container image URI"
        value: ${{ jobs.image-build.outputs.image_uri }}

jobs:
  image-build:
    name: Build Docker Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version || github.sha }}
      image_uri: ${{ steps.set-output.outputs.image_uri }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Image Name
        id: resolve-name
        run: |
          # Convert repository name to lowercase for Docker registry compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ inputs.image-name }}"
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${REPO_LOWER}"
          fi
          echo "full_image_name=${{ inputs.registry }}/${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Docker Metadata Action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve-name.outputs.full_image_name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr

      - name: Authenticate to Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ !inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set Image Outputs
        id: set-output
        run: |
          FULL_URI="${{ steps.resolve-name.outputs.full_image_name }}:${{ github.sha }}"
          echo "image_uri=${FULL_URI}" >> $GITHUB_OUTPUT
          echo "[+] Built image URI: ${FULL_URI}"
