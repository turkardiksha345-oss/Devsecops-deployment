name: Reusable Test & Static Analysis

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use for test environment"
        required: false
        default: "3.11"
        type: string
    outputs:
      test-status:
        description: "Outcome status of test suite"
        value: ${{ jobs.test.outputs.status }}

jobs:
  test:
    name: Unit Tests & Linting
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.test-step.outcome }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Install Development & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Flake8 Code Style Analysis
        run: |
          echo "[*] Executing Flake8 static analysis..."
          flake8 app/ tests/

      - name: Run Pylint Static Code Analysis
        run: |
          echo "[*] Executing Pylint code quality scan..."
          pylint app/

      - name: Run Bandit Security Linter
        run: |
          echo "[*] Executing Bandit AST security analysis on app/..."
          mkdir -p security-reports
          bandit -r app/ -f screen
          bandit -r app/ -f json -o security-reports/bandit-report.json || true

      - name: Run Pytest Test Suite with Coverage & JUnit XML
        id: test-step
        run: |
          echo "[*] Executing Pytest test suite with code coverage..."
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml

      - name: Upload Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "test-and-coverage-reports-${{ github.sha }}"
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            security-reports/bandit-report.json
          retention-days: 14
