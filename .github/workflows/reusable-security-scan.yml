name: Reusable Security Scans

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker image tag to scan"
        required: false
        default: "latest"
        type: string
      image-uri:
        description: "Full Docker image URI to scan"
        required: false
        default: "devsecops-app:latest"
        type: string
    secrets:
      sonar-token:
        description: "SonarQube authentication token"
        required: false
      sonar-host-url:
        description: "SonarQube server host URL"
        required: false
      snyk-token:
        description: "Snyk API token"
        required: false
    outputs:
      scan-status:
        description: "Aggregated security scans result"
        value: ${{ jobs.security-scans.outputs.status }}

jobs:
  security-scans:
    name: DevSecOps Scanners (SonarQube, Trivy, Snyk, ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    outputs:
      status: "completed"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for accurate SonarQube analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Report Generator Tools
        run: |
          pip install -r requirements-dev.txt
          mkdir -p security-reports reports

      # -------------------------------------------------------------
      # 1. SonarQube Static Application Security Testing (SAST)
      # -------------------------------------------------------------
      - name: Run SonarCloud / SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        continue-on-error: true

      # -------------------------------------------------------------
      # 2. Build local container image for vulnerability & DAST scanning
      # -------------------------------------------------------------
      - name: Build Local Image for Scanning
        run: |
          echo "[*] Building local container image for vulnerability scanning..."
          docker build -t scan-target-app:latest .

      # -------------------------------------------------------------
      # 3. Trivy Container Image & Filesystem Vulnerability Scanner
      # -------------------------------------------------------------
      - name: Run Trivy Vulnerability Scanner (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "scan-target-app:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (JSON & Table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "scan-target-app:latest"
          format: "json"
          output: "security-reports/trivy-results.json"
        continue-on-error: true

      - name: Upload Trivy SARIF Results to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

      # -------------------------------------------------------------
      # 4. Snyk Dependency & Container Security
      # -------------------------------------------------------------
      - name: Run Snyk Open Source Dependency Scan
        uses: snyk/actions/python-3.10@master
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        with:
          args: --severity-threshold=high --json-file-output=security-reports/snyk-report.json
        continue-on-error: true

      # -------------------------------------------------------------
      # 5. OWASP ZAP Dynamic Application Security Testing (DAST)
      # -------------------------------------------------------------
      - name: Start Flask App Container for DAST
        run: |
          echo "[*] Launching containerized application on port 5000..."
          docker run -d --name zap-test-app -p 5000:5000 scan-target-app:latest
          
          echo "[*] Waiting for container health check..."
          for i in {1..15}; do
            if curl -s http://localhost:5000/health | grep -q "UP"; then
              echo "[+] App container is HEALTHY and ready for ZAP scan."
              break
            fi
            sleep 2
          done

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          ruleset: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: false
          artifact_name: "zap-report"
        continue-on-error: true

      - name: Stop DAST Test Container
        if: always()
        run: |
          docker stop zap-test-app || true
          docker rm zap-test-app || true

      # -------------------------------------------------------------
      # 6. Consolidate Security Reports for GitHub Pages
      # -------------------------------------------------------------
      - name: Generate Consolidated Security Portal HTML
        run: |
          # Copy any ZAP html reports if generated by the ZAP action in workspace
          if [ -f zap_report.html ]; then
            cp zap_report.html security-reports/zap-report.html
          fi
          
          python scripts/generate-reports.py

      - name: Upload Security Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "security-reports-portal"
          path: reports/
          retention-days: 14
