[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --junitxml=test-results.xml
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
